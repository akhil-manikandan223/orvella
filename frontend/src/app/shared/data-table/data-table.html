<div class="data-table__wrapper">
  @if (hasBulkActions() && selection().length > 0) {
    <div class="data-table__bulk-bar">
      <span class="data-table__bulk-count">{{ selection().length }} selected</span>
      <div class="data-table__bulk-actions">
        @for (action of bulkActions(); track action.label) {
          <button
            pButton
            size="small"
            [severity]="action.severity ?? 'secondary'"
            (click)="action.onClick(selection())"
          >
            <i [class]="action.icon" aria-hidden="true"></i>
            {{ action.label }}
          </button>
        }
        <button pButton size="small" [text]="true" severity="secondary" (click)="clearSelection()">
          Clear
        </button>
      </div>
    </div>
  }

  <ag-grid-angular
    class="data-table__grid"
    [theme]="theme"
    [rowData]="rowData()"
    [columnDefs]="columnDefs()"
    [getRowId]="getRowId"
    [loading]="loading()"
    [pagination]="true"
    [paginationPageSize]="rowsPerPage()"
    [paginationPageSizeSelector]="rowsPerPageOptions()"
    [rowSelection]="rowSelection()"
    [isFullWidthRow]="isFullWidthRow"
    [fullWidthCellRenderer]="detailRowRenderer"
    [fullWidthCellRendererParams]="fullWidthRowParams()"
    [getRowHeight]="getRowHeight"
    [getRowClass]="getRowClass"
    [postSortRows]="postSortRows"
    [noRowsOverlayComponent]="emptyOverlay"
    [noRowsOverlayComponentParams]="emptyOverlayParams()"
    (gridReady)="onGridReady($event)"
    (selectionChanged)="onSelectionChanged($event)"
    (cellClicked)="onCellClicked($event)"
  />
</div>
