<div class="page-header">
  <div class="page-header__identity">
    @if (showBack()) {
      <button
        pButton
        [text]="true"
        severity="secondary"
        class="page-header__back"
        aria-label="Go back"
        (click)="goBack()"
      >
        <i class="pi pi-arrow-left" aria-hidden="true"></i>
      </button>
    }
    @if (icon(); as iconClass) {
      <span class="page-header__icon">
        <i [class]="iconClass" aria-hidden="true"></i>
      </span>
    }
    <h1 [attr.title]="subtitle()">{{ title() }}</h1>
  </div>

  <div class="page-header__toolbar">
    @if (showSearch()) {
      <p-iconfield class="page-header__search">
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          [placeholder]="searchPlaceholder()"
          [attr.aria-label]="searchPlaceholder()"
          (input)="onSearchInput($event)"
        />
      </p-iconfield>
    }

    <div class="page-header__actions">
      <ng-content />
    </div>

    @if (showRefresh()) {
      <button pButton [text]="true" severity="secondary" aria-label="Refresh" (click)="refresh.emit()">
        <i class="pi pi-refresh" aria-hidden="true"></i>
      </button>
    }
  </div>
</div>
