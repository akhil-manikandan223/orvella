<div brnPopover align="end" [sideOffset]="4">
  <button
    brnPopoverTrigger
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    aria-label="Table settings"
  >
    <i class="pi pi-cog" aria-hidden="true"></i>
  </button>
  <ng-template brnPopoverContent>
    <div
      class="min-w-40 rounded-md border border-border bg-popover p-1 text-popover-foreground shadow-lg animate-in fade-in-0"
      role="menu"
    >
      <button
        type="button"
        role="menuitem"
        class="table-settings__menu-item"
        (click)="openCustomize()"
      >
        <i class="pi pi-sliders-h" aria-hidden="true"></i>
        Customize
      </button>
    </div>
  </ng-template>
</div>

<app-form-drawer
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  header="Customize Columns"
  width="22rem"
>
  @if (drawerVisible()) {
    <div class="table-settings__list">
      @for (column of columns(); track column.field) {
        <label class="table-settings__item">
          <input
            type="checkbox"
            [checked]="visibleFields().has(column.field)"
            (change)="onColumnToggle(column.field, $event)"
          />
          <span>{{ column.header }}</span>
        </label>
      }
    </div>
    <div class="table-settings__actions">
      <button hlmBtn type="button" [disabled]="saving()" (click)="saveChanges()">
        <i
          class="pi"
          [class.pi-spin]="saving()"
          [class.pi-spinner]="saving()"
          [class.pi-check]="!saving()"
          aria-hidden="true"
        ></i>
        Save
      </button>
    </div>
  }
</app-form-drawer>
