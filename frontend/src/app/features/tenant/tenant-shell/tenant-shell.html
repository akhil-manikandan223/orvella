<div class="tenant-shell">
  <header class="tenant-shell__topbar">
    <div class="tenant-shell__brand">
      <button
        pButton
        class="tenant-shell__menu-toggle"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        aria-label="Toggle navigation menu"
        (click)="toggleSidebar()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <img
        ngSrc="assets/logos/orvella-header-light-logo.png"
        alt="Orvella"
        width="120"
        height="32"
        priority
      />
      <span class="tenant-shell__tenant-name">{{ tenantAuthService.tenant()?.name }}</span>
    </div>
    <div class="tenant-shell__end">
      <span class="tenant-shell__email">{{ tenantAuthService.user()?.email }}</span>
      <button pButton [text]="true" severity="secondary" aria-label="Sign out" (click)="logout()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="app-shell-body" [class.app-shell-body--sidebar-open]="sidebarOpen()">
    <aside class="app-shell-sidebar">
      <app-sidebar-nav [groups]="navGroups" (navigated)="closeSidebar()" />
    </aside>

    @if (sidebarOpen()) {
      <button
        type="button"
        class="app-shell-scrim"
        aria-label="Close navigation menu"
        (click)="closeSidebar()"
      ></button>
    }

    <main class="app-shell-content">
      <router-outlet />
    </main>
  </div>
</div>
