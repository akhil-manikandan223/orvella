<form class="department-form" (submit)="onSubmit($event)">
  <div class="department-form__field">
    <label for="department-name">Name</label>
    <input
      id="department-name"
      pInputText
      fluid
      [formField]="departmentForm.name"
      [class.p-invalid]="departmentForm.name().touched() && departmentForm.name().invalid()"
    />
    @if (departmentForm.name().touched()) {
      @for (error of departmentForm.name().errors(); track error.kind) {
        <small class="department-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="department-form__field">
    <label for="department-description">Description (optional)</label>
    <textarea
      id="department-description"
      pTextarea
      fluid
      rows="3"
      [formField]="departmentForm.description"
    ></textarea>
  </div>

  <div class="department-form__actions">
    <button pButton type="button" [text]="true" severity="secondary" (click)="cancelled.emit()">
      Cancel
    </button>
    <button pButton type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      }
      Save
    </button>
  </div>
</form>
