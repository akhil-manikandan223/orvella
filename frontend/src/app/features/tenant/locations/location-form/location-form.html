<form class="location-form" (submit)="onSubmit($event)">
  <div class="location-form__field">
    <label for="location-name">Name</label>
    <input
      id="location-name"
      pInputText
      fluid
      [formField]="locationForm.name"
      [class.p-invalid]="locationForm.name().touched() && locationForm.name().invalid()"
    />
    @if (locationForm.name().touched()) {
      @for (error of locationForm.name().errors(); track error.kind) {
        <small class="location-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="location-form__field">
    <label for="location-address">Address (optional)</label>
    <textarea
      id="location-address"
      pTextarea
      fluid
      rows="3"
      [formField]="locationForm.address"
    ></textarea>
  </div>

  <div class="location-form__actions">
    <button pButton type="button" [text]="true" severity="secondary" (click)="cancelled.emit()">
      Cancel
    </button>
    <button pButton type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      }
      Save
    </button>
  </div>
</form>
