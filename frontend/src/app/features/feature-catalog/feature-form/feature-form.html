<form class="feature-form" novalidate (submit)="onSubmit($event)">
  <div class="feature-form__field">
    <label for="feature-key">Key</label>
    <input
      id="feature-key"
      hlmInput
      [formField]="featureForm.key"
      [attr.aria-invalid]="(featureForm.key().touched() && featureForm.key().invalid()) || null"
    />
    @if (featureForm.key().touched()) {
      @for (error of featureForm.key().errors(); track error.kind) {
        <small class="feature-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="feature-form__field">
    <label for="feature-name">Name</label>
    <input
      id="feature-name"
      hlmInput
      [formField]="featureForm.name"
      [attr.aria-invalid]="(featureForm.name().touched() && featureForm.name().invalid()) || null"
    />
    @if (featureForm.name().touched()) {
      @for (error of featureForm.name().errors(); track error.kind) {
        <small class="feature-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="feature-form__field">
    <label for="feature-description">Description (optional)</label>
    <textarea
      id="feature-description"
      hlmInput
      rows="3"
      [formField]="featureForm.description"
    ></textarea>
  </div>

  <div class="feature-form__field">
    <label for="feature-status">Status</label>
    <app-select
      inputId="feature-status"
      [formField]="$any(featureForm.status)"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [filter]="false"
    />
  </div>

  <div class="feature-form__actions">
    <button hlmBtn variant="ghost" type="button" (click)="cancelled.emit()">Cancel</button>
    <button hlmBtn type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      }
      Save
    </button>
  </div>
</form>
