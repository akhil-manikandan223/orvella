<app-page-header
  title="Cities"
  subtitle="Cities by state and district"
  icon="pi pi-building-columns"
  [showSearch]="true"
  [showRefresh]="true"
  (search)="searchTerm.set($event)"
  (refresh)="load()"
>
  <button pButton (click)="openCreate()">
    <i class="pi pi-plus" aria-hidden="true"></i>
    New
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [value]="cities()"
  [actions]="actions"
  [loading]="loading()"
  [globalFilter]="searchTerm()"
  emptyMessage="No cities yet."
  emptyIcon="pi pi-building-columns"
/>

<app-form-drawer
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editingCity() ? 'Edit City' : 'New City'"
>
  @if (dialogVisible()) {
    <app-city-form
      [city]="editingCity()"
      [states]="states()"
      [districts]="districts()"
      (saved)="onSaved()"
      (cancelled)="dialogVisible.set(false)"
    />
  }
</app-form-drawer>
