<app-page-header
  title="Districts"
  subtitle="Districts by state"
  icon="pi pi-map-marker"
  [showSearch]="true"
  [showRefresh]="true"
  (search)="searchTerm.set($event)"
  (refresh)="load()"
>
  <button pButton (click)="openCreate()">
    <i class="pi pi-plus" aria-hidden="true"></i>
    New
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [value]="districts()"
  [actions]="actions"
  [loading]="loading()"
  [globalFilter]="searchTerm()"
  emptyMessage="No districts yet."
  emptyIcon="pi pi-map-marker"
/>

<app-form-drawer
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editingDistrict() ? 'Edit District' : 'New District'"
>
  @if (dialogVisible()) {
    <app-district-form
      [district]="editingDistrict()"
      [states]="states()"
      (saved)="onSaved()"
      (cancelled)="dialogVisible.set(false)"
    />
  }
</app-form-drawer>
