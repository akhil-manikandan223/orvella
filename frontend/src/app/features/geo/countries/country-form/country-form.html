<form class="country-form" (submit)="onSubmit($event)">
  <div class="country-form__field">
    <label for="country-name">Name</label>
    <input
      id="country-name"
      hlmInput
      [formField]="countryForm.name"
      [attr.aria-invalid]="(countryForm.name().touched() && countryForm.name().invalid()) || null"
    />
    @if (countryForm.name().touched()) {
      @for (error of countryForm.name().errors(); track error.kind) {
        <small class="country-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="country-form__field">
    <label for="country-slug">Slug</label>
    <input
      id="country-slug"
      hlmInput
      [formField]="countryForm.slug"
      [attr.aria-invalid]="(countryForm.slug().touched() && countryForm.slug().invalid()) || null"
    />
    @if (countryForm.slug().touched()) {
      @for (error of countryForm.slug().errors(); track error.kind) {
        <small class="country-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="country-form__actions">
    <button hlmBtn variant="ghost" type="button" (click)="cancelled.emit()">Cancel</button>
    <button hlmBtn type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      }
      Save
    </button>
  </div>
</form>
