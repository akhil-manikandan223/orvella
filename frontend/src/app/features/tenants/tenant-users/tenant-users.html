<div class="tenant-users__toolbar">
  <p-selectbutton
    [options]="statusFilterOptions"
    optionLabel="label"
    optionValue="value"
    [ngModel]="statusFilter()"
    (onChange)="statusFilter.set($event.value)"
    [allowEmpty]="false"
    aria-label="Filter users by status"
  />
  <button pButton size="small" (click)="openCreate()">
    <i class="pi pi-plus" aria-hidden="true"></i>
    New User
  </button>
</div>

<app-data-table
  [columns]="columns"
  [actions]="actions()"
  [value]="filteredUsers()"
  [loading]="loading()"
  emptyMessage="No users match this filter."
  emptyIcon="pi pi-users"
/>

<app-form-drawer
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  [header]="drawerHeader()"
>
  @if (drawerVisible()) {
    <form class="tenant-users__form" (submit)="onSubmit($event)">
      <div class="tenant-users__field">
        <label for="tenant-user-email">Email</label>
        <input
          id="tenant-user-email"
          type="email"
          pInputText
          [formField]="userForm.email"
          [class.p-invalid]="userForm.email().touched() && userForm.email().invalid()"
        />
        @if (userForm.email().touched()) {
          @for (error of userForm.email().errors(); track error.kind) {
            <small class="tenant-users__error">{{ error.message }}</small>
          }
        }
      </div>

      @if (!editingUser()) {
        <div class="tenant-users__field">
          <label for="tenant-user-password">Password</label>
          <input
            id="tenant-user-password"
            type="password"
            pInputPassword
            fluid
            [formField]="userForm.password"
            [class.p-invalid]="userForm.password().touched() && userForm.password().invalid()"
          />
          @if (userForm.password().touched()) {
            @for (error of userForm.password().errors(); track error.kind) {
              <small class="tenant-users__error">{{ error.message }}</small>
            }
          }
        </div>
      }

      <div class="tenant-users__field">
        <label for="tenant-user-role">Role</label>
        <p-select
          inputId="tenant-user-role"
          [formField]="$any(userForm.role)"
          [options]="roleOptions"
          optionLabel="label"
          optionValue="value"
        />
      </div>

      <div class="tenant-users__actions">
        <button pButton type="button" [text]="true" severity="secondary" (click)="drawerVisible.set(false)">
          Cancel
        </button>
        <button pButton [disabled]="submitting()">
          <i class="pi" [class.pi-spin]="submitting()" [class.pi-spinner]="submitting()" [class.pi-check]="!submitting()" aria-hidden="true"></i>
          Save
        </button>
      </div>
    </form>
  }
</app-form-drawer>
