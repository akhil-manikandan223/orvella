<form class="category-form" novalidate (submit)="onSubmit($event)">
  <div class="category-form__field">
    <label for="category-name">Name</label>
    <input
      id="category-name"
      hlmInput
      [formField]="categoryForm.name"
      [attr.aria-invalid]="(categoryForm.name().touched() && categoryForm.name().invalid()) || null"
    />
    @if (categoryForm.name().touched()) {
      @for (error of categoryForm.name().errors(); track error.kind) {
        <small class="category-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="category-form__field">
    <label for="category-slug">Slug</label>
    <input
      id="category-slug"
      hlmInput
      [formField]="categoryForm.slug"
      [attr.aria-invalid]="(categoryForm.slug().touched() && categoryForm.slug().invalid()) || null"
    />
    @if (categoryForm.slug().touched()) {
      @for (error of categoryForm.slug().errors(); track error.kind) {
        <small class="category-form__error">{{ error.message }}</small>
      }
    }
  </div>

  <div class="category-form__actions">
    <button hlmBtn variant="ghost" type="button" (click)="cancelled.emit()">Cancel</button>
    <button hlmBtn type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      }
      Save
    </button>
  </div>
</form>
