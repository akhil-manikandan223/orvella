<app-page-header
  title="Organization Types"
  subtitle="Second-level organization taxonomy"
  icon="pi pi-tags"
  [showSearch]="true"
  [showRefresh]="true"
  (search)="searchTerm.set($event)"
  (refresh)="load()"
>
  <button pButton (click)="openCreate()">
    <i class="pi pi-plus" aria-hidden="true"></i>
    New
  </button>
</app-page-header>

<app-data-table
  [columns]="columns"
  [value]="types()"
  [actions]="actions"
  [loading]="loading()"
  [globalFilter]="searchTerm()"
  emptyMessage="No organization types yet."
  emptyIcon="pi pi-tags"
/>

<app-edit-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [header]="editingType() ? 'Edit Type' : 'New Type'"
>
  @if (dialogVisible()) {
    <app-type-form
      [type]="editingType()"
      [categories]="categories()"
      (saved)="onSaved()"
      (cancelled)="dialogVisible.set(false)"
    />
  }
</app-edit-dialog>
