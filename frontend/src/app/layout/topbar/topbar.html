<header class="app-topbar">
  <div class="app-topbar__start">
    <button
      type="button"
      class="app-topbar__icon-btn app-shell-menu-toggle"
      aria-label="Toggle navigation menu"
      (click)="menuToggle.emit()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    <!-- White-wordmark logo in both themes: the bar is navy in light and dark. -->
    <img
      ngSrc="assets/logos/orvella-header-dark-logo.png"
      alt="Orvella"
      width="109"
      height="32"
      priority
    />
  </div>

  <div class="app-topbar__end">
    <button type="button" class="app-topbar__icon-btn" aria-label="mobile app">
      <i class="pi pi-mobile" aria-hidden="true"></i>
    </button>
    @if (authService.admin(); as admin) {
      <div brnPopover align="end" [sideOffset]="6">
        <button
          type="button"
          class="app-topbar__account"
          brnPopoverTrigger
          aria-haspopup="true"
          [attr.aria-label]="'Account menu for ' + admin.email"
        >
          <span class="app-topbar__avatar" aria-hidden="true">{{ avatarLabel() }}</span>
          <span class="app-topbar__email">{{ admin.email }}</span>
        </button>
        <ng-template brnPopoverContent>
          <div
            class="rounded-md border border-border bg-popover text-popover-foreground shadow-lg animate-in fade-in-0 min-w-40 p-1"
          >
            <a routerLink="/profile" class="app-topbar-menu-item" (click)="closeAccountMenu()">
              <i class="pi pi-user" aria-hidden="true"></i>
              Profile
            </a>
          </div>
        </ng-template>
      </div>
    }
    <button
      type="button"
      class="app-topbar__icon-btn"
      aria-label="Log out"
      (click)="authService.logout()"
    >
      <i class="pi pi-sign-out" aria-hidden="true"></i>
    </button>
  </div>
</header>
