<div class="shell">
  <app-topbar (menuToggle)="toggleSidebar()" />

  <div class="app-shell-body" [class.app-shell-body--sidebar-open]="sidebarOpen()">
    <aside class="app-shell-sidebar">
      <app-sidebar-nav [groups]="navGroups" (navigated)="closeSidebar()" />
    </aside>

    @if (sidebarOpen()) {
      <button
        type="button"
        class="app-shell-scrim"
        aria-label="Close navigation menu"
        (click)="closeSidebar()"
      ></button>
    }

    <main class="app-shell-content">
      <router-outlet />
    </main>
  </div>
</div>
